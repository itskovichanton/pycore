[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mybootstrap_core_itskovichanton"
version = "1.0.0"
authors = [
    { name = "Anton Itskovich", email = "itskovichae@gmail.com" },
]
description = "My bootstrap app engine core classes"
readme = "README.md"
requires-python = ">=3.7"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "aio-pika",
    "python-benedict",
    "dacite",
    "dataclasses-json",
    "python-dateutil",
    "event-bus",
    "fastapi",
    "greenletio",
    "python-jose",
    "numpy",
    "opyoid",
    "paprika",
    "paramiko",
    "patool",
    "peewee",
    "pika",
    "prometheus-client",
    "psutil",
    "python-json-logger",
    "redis",
    "requests",
    "retrying",
    "schedule",
    "six",
    "starlette",
    "urllib3",
    "xsdata",
]

[project.urls]
"Homepage" = "https://github.com/itskovichanton/pycore"

[tool.hatch.build.targets.wheel]
packages = ["src"]
